<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>拍片排程小助手</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A9BAD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拍片排程">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
    --sage:#9AAE9B; --light-sage:#E8F0E8;
    --yellow:#EAD16B; --light-yellow:#FBF3D9;
    --danger:#C1685D; --light-danger:#F5E0DC;
    --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
    --radius:16px; --radius-sm:10px;
    --shadow:0 4px 16px rgba(55,53,47,0.08);
    --shadow-md:0 8px 28px rgba(55,53,47,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC", -apple-system, sans-serif;
    background:var(--bg);
    color:var(--dark);
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1,h2,h3,h4{margin:0; font-weight:700;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  textarea, input, select{font-family:inherit;}

  /* ---------- topbar ---------- */
  .topbar{
    background:linear-gradient(135deg, var(--light-blue), var(--light-yellow));
    border-bottom:1px solid var(--soft-blue);
    position:sticky; top:0; z-index:20;
  }
  .topbar-inner{
    max-width:960px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 10px;
    gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-icon{
    font-size:26px; width:44px; height:44px; border-radius:12px;
    background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  .brand-title{font-size:19px; letter-spacing:0.3px;}
  .brand-sub{font-size:12.5px; color:var(--medium); margin-top:2px;}
  .topbar-actions{display:flex; gap:8px;}

  .btn{
    border:none; border-radius:999px; padding:9px 16px;
    font-size:13.5px; font-weight:700; transition:transform .12s ease, box-shadow .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--blue); color:#fff; box-shadow:0 4px 10px rgba(122,155,173,0.45);}
  .btn-primary:hover{box-shadow:0 6px 14px rgba(122,155,173,0.55);}
  .btn-ghost{background:#fff; color:var(--dark); border:1px solid var(--soft-blue);}
  .btn-ghost:hover{background:var(--light-blue);}
  .btn-sage{background:var(--sage); color:#fff;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-text{background:transparent; color:var(--medium); padding:8px 10px;}
  .btn-text:hover{color:var(--dark);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  .tabnav{
    max-width:960px; margin:0 auto;
    display:flex; gap:6px; padding:6px 20px 0;
    overflow-x:auto;
  }
  .tab-btn{
    background:transparent; border:none; padding:10px 16px 12px;
    font-size:14px; font-weight:700; color:var(--medium);
    border-bottom:3px solid transparent; flex-shrink:0;
  }
  .tab-btn.active{color:var(--dark); border-bottom-color:var(--blue);}

  /* ---------- layout ---------- */
  .main{max-width:960px; margin:0 auto; padding:20px;}
  .section-title{font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .section-title .dot{width:8px; height:8px; border-radius:50%; background:var(--blue); display:inline-block;}

  /* ---------- banners ---------- */
  .banner{
    display:flex; align-items:center; gap:10px;
    padding:13px 16px; border-radius:var(--radius-sm);
    margin-bottom:14px; font-size:13.5px; font-weight:500;
  }
  .banner-danger{background:var(--light-danger); color:var(--dark); border:1px solid var(--danger);}
  .banner-yellow{background:var(--light-yellow); color:var(--dark); border:1px solid var(--yellow);}
  .banner b{font-weight:700;}
  .banner-link{margin-left:auto; background:#fff; border:none; border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:700; color:var(--dark); flex-shrink:0;}

  /* ---------- dashboard cards ---------- */
  .card-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:22px;
  }
  .stat-card{
    background:#fff; border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); border:1px solid var(--light-blue);
  }
  .stat-card .label{font-size:12px; color:var(--medium); font-weight:500; margin-bottom:8px;}
  .stat-card .value{font-size:26px; font-weight:900;}
  .stat-card .sub{font-size:11.5px; color:var(--gray); margin-top:4px;}
  .stat-card.primary{background:linear-gradient(160deg, #fff, var(--soft-blue));}
  .stat-card.blue{background:linear-gradient(160deg, #fff, var(--light-blue));}
  .stat-card.sage{background:linear-gradient(160deg, #fff, var(--light-sage));}
  .stat-card.yellow{background:linear-gradient(160deg, #fff, var(--light-yellow));}

  .panel{
    background:#fff; border-radius:var(--radius); padding:18px;
    box-shadow:var(--shadow); border:1px solid var(--light-blue); margin-bottom:18px;
  }

  .today-item{
    border:1px solid var(--light-blue); border-radius:var(--radius-sm);
    padding:14px; margin-bottom:10px; background:var(--cream);
  }
  .today-item:last-child{margin-bottom:0;}
  .today-item-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .today-item .topic{font-size:15px; font-weight:700;}
  .today-item .hook{font-size:13px; color:var(--medium); margin-top:5px; line-height:1.5;}
  .today-item .meta-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  .empty-state{
    text-align:center; padding:34px 16px; color:var(--medium);
  }
  .empty-state .emoji{font-size:34px; display:block; margin-bottom:10px;}
  .empty-state p{margin-bottom:14px; font-size:13.5px;}

  .badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .badge-done{background:var(--light-sage); color:#3E5B3F;}
  .badge-pending{background:var(--light-blue); color:#3B5568;}
  .badge-overdue{background:var(--light-danger); color:#8C3B30;}
  .badge-today{background:var(--light-yellow); color:#7A6316;}

  /* ---------- calendar ---------- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-head .month-label{font-size:17px;}
  .cal-nav{display:flex; gap:6px; align-items:center;}
  .cal-nav button{
    background:#fff; border:1px solid var(--soft-blue); width:32px; height:32px;
    border-radius:50%; font-size:14px; font-weight:700; color:var(--dark);
  }
  .weekday-row{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:6px;}
  .weekday-row span{font-size:11.5px; color:var(--gray); font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-cell{
    min-height:64px; border-radius:10px; border:1px solid var(--light-blue);
    padding:6px 5px; background:#fff; text-align:left; position:relative;
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
  }
  .cal-cell.blank{background:transparent; border:none;}
  .cal-cell .num{font-size:12px; font-weight:700; color:var(--medium);}
  .cal-cell.is-today{border:2px solid var(--blue); background:var(--light-blue);}
  .cal-cell.is-selected{outline:2px solid var(--yellow); outline-offset:-2px;}
  .cal-dots{display:flex; gap:3px; flex-wrap:wrap;}
  .cal-dot{width:7px; height:7px; border-radius:50%;}
  .cal-dot.done{background:var(--sage);}
  .cal-dot.pending{background:var(--blue);}
  .cal-dot.overdue{background:var(--danger);}
  .cal-more{font-size:10px; color:var(--gray);}

  .day-detail-title{font-size:14.5px; margin-bottom:10px; color:var(--medium); font-weight:700;}

  /* ---------- list ---------- */
  .list-controls{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .search-box{
    flex:1; min-width:160px; display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--soft-blue); border-radius:999px; padding:9px 14px;
  }
  .search-box input{border:none; outline:none; flex:1; font-size:13.5px; background:transparent; color:var(--dark);}
  select.filter-select{
    border:1px solid var(--soft-blue); border-radius:999px; padding:9px 14px;
    background:#fff; font-size:13px; color:var(--dark); font-weight:500;
  }
  .video-card{
    background:#fff; border:1px solid var(--light-blue); border-radius:var(--radius);
    padding:15px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .video-card-head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .video-card .date-label{font-size:12px; color:var(--blue); font-weight:700; margin-bottom:3px;}
  .video-card .topic{font-size:15.5px; font-weight:700;}
  .video-card .field-row{margin-top:10px; font-size:13px; line-height:1.55;}
  .video-card .field-label{font-size:11px; color:var(--gray); font-weight:700; letter-spacing:0.5px; margin-bottom:2px;}
  .video-card .field-text{color:var(--medium); white-space:pre-wrap;}
  .video-card-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .video-card .toggle-wrap{display:flex; align-items:center; gap:6px; flex-shrink:0;}

  .checkbox-round{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--soft-blue);
    background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0;
  }
  .checkbox-round.checked{background:var(--sage); border-color:var(--sage); color:#fff;}

  /* ---------- overlay / modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(55,53,47,0.45);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
    animation:fadeIn .15s ease;
  }
  .overlay.hidden{display:none;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:22px 20px 26px;
    box-shadow:var(--shadow-md); animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-sm{max-width:440px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-close{background:var(--light-blue); border:none; width:30px; height:30px; border-radius:50%; font-size:15px; color:var(--dark);}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block; font-size:12.5px; font-weight:700; color:var(--medium); margin-bottom:6px;}
  .form-group .hint{font-weight:400; color:var(--gray); font-size:11px;}
  .form-group input[type=text], .form-group input[type=date], .form-group textarea{
    width:100%; border:1px solid var(--soft-blue); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:14px; color:var(--dark); background:var(--cream);
    resize:vertical; outline:none;
  }
  .form-group input:focus, .form-group textarea:focus{border-color:var(--blue); background:#fff;}
  .form-group textarea{min-height:64px; line-height:1.5;}
  .form-group textarea.tall{min-height:120px;}
  .form-check{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .form-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}
  .form-actions .btn{flex:1;}

  .backup-desc{font-size:13px; color:var(--medium); line-height:1.6; margin-bottom:16px;}
  .backup-row{display:flex; gap:10px; margin-bottom:10px;}
  .backup-row .btn{flex:1;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--dark); color:#fff; padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:500; box-shadow:var(--shadow-md); z-index:200;
  }
  .toast.hidden{display:none;}

  /* ---------- responsive ---------- */
  @media (max-width:640px){
    .card-grid{grid-template-columns:repeat(2,1fr);}
    .topbar-inner{padding:14px 14px 6px;}
    .tabnav{padding:6px 10px 0;}
    .main{padding:14px;}
    .brand-title{font-size:16.5px;}
    .cal-cell{min-height:52px; padding:4px;}
    .stat-card .value{font-size:21px;}
  }
  @media (max-width:400px){
    .card-grid{grid-template-columns:repeat(2,1fr); gap:8px;}
    .stat-card{padding:12px;}
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">🎬</span>
        <div>
          <h1 class="brand-title">拍片排程小助手</h1>
          <p class="brand-sub">內容排好，就不怕自己偷懶</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btnBackup" class="btn btn-ghost">📦 備份</button>
        <button id="btnAdd" class="btn btn-primary">＋ 新增影片</button>
      </div>
    </div>
    <nav class="tabnav">
      <button class="tab-btn" data-view="dashboard">總覽儀表板</button>
      <button class="tab-btn" data-view="calendar">拍片行事曆</button>
      <button class="tab-btn" data-view="list">影片清單</button>
    </nav>
  </header>

  <main id="mainContent" class="main"></main>
</div>

<!-- 新增／編輯表單 -->
<div id="formOverlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <h3 id="formTitle">新增一則短影音</h3>
      <button class="modal-close" id="formCloseBtn">✕</button>
    </div>
    <form id="videoForm">
      <div class="form-group">
        <label for="f_date">拍攝日期</label>
        <input type="date" id="f_date" required>
      </div>
      <div class="form-group">
        <label for="f_publishDate">預計發布日 <span class="hint">— 選填</span></label>
        <input type="date" id="f_publishDate">
      </div>
      <div class="form-group">
        <label for="f_topic">影片主題</label>
        <input type="text" id="f_topic" placeholder="例如：三個NG的減脂早餐地雷" required>
      </div>
      <div class="form-group">
        <label for="f_hook">開頭 3 秒 Hook <span class="hint">— 留住觀眾的第一句話</span></label>
        <textarea id="f_hook" placeholder="例如：你早餐吃的『健康』食物，其實正在讓你變胖..."></textarea>
      </div>
      <div class="form-group">
        <label for="f_content">影片主軸內容 <span class="hint">— 逐字稿 / 重點大綱</span></label>
        <textarea class="tall" id="f_content" placeholder="貼上 AI 發想好的逐字稿或重點..."></textarea>
      </div>
      <div class="form-group">
        <label for="f_cta">結尾 CTA</label>
        <textarea id="f_cta" placeholder="例如：想要客製化菜單，留言『菜單』我傳給你"></textarea>
      </div>
      <div class="form-group">
        <label class="form-check">
          <span class="checkbox-round" id="f_completeToggle">✓</span>
          <span>這則影片已經拍完了</span>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" id="formDeleteBtn" class="btn btn-danger" style="display:none;">刪除</button>
        <button type="button" id="formCancelBtn" class="btn btn-ghost">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- 備份匯出匯入 -->
<div id="backupOverlay" class="overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-head">
      <h3>資料備份</h3>
      <button class="modal-close" id="backupCloseBtn">✕</button>
    </div>
    <p class="backup-desc">所有資料都只存在這台裝置的瀏覽器裡。換電腦、換手機，或不小心清除瀏覽器資料前，記得先匯出備份檔。</p>
    <div class="backup-row">
      <button id="exportBtn" class="btn btn-sage">⬇ 匯出備份檔</button>
    </div>
    <div class="backup-row">
      <button id="importBtn" class="btn btn-ghost">⬆ 匯入備份檔</button>
    </div>
    <p class="backup-desc" style="margin-top:4px;">匯入會覆蓋目前裝置上的所有資料，請先確認再匯入。</p>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" hidden>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "reelsPlanner_videos_v1";
  var REMINDER_KEY = "reelsPlanner_lastReminderDate";
  var WEEKDAYS = ["日","一","二","三","四","五","六"];

  /* ---------------- data layer ---------------- */
  function loadVideos(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveVideos(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function genId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  var videos = loadVideos();

  /* ---------------- date helpers ---------------- */
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function formatDate(d){
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function todayStr(){ return formatDate(new Date()); }
  function parseDate(str){
    var parts = str.split("-");
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }
  function friendlyDate(str){
    var d = parseDate(str);
    return (d.getMonth()+1) + "/" + d.getDate() + "（" + WEEKDAYS[d.getDay()] + "）";
  }
  function startOfWeek(d){
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1) - day; // 週一為起點
    var monday = new Date(d);
    monday.setDate(d.getDate()+diff);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function endOfWeek(d){
    var s = startOfWeek(d);
    var e = new Date(s);
    e.setDate(s.getDate()+6);
    e.setHours(23,59,59,999);
    return e;
  }

  function getStatus(v){
    if(v.completed) return "done";
    if(v.date < todayStr()) return "overdue";
    if(v.date === todayStr()) return "today";
    return "pending";
  }

  /* ---------------- state ---------------- */
  var state = {
    view: "dashboard",
    calMonth: new Date().getMonth(),
    calYear: new Date().getFullYear(),
    selectedDay: todayStr(),
    search: "",
    statusFilter: "all",
    sortDir: "desc"
  };

  var mainEl = document.getElementById("mainContent");

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.add("hidden"); }, 2200);
  }

  /* ---------------- render dispatch ---------------- */
  function render(){
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.view === state.view);
    });
    if(state.view === "dashboard") renderDashboard();
    else if(state.view === "calendar") renderCalendar();
    else renderList();
  }

  /* ---------------- dashboard ---------------- */
  function renderDashboard(){
    var today = todayStr();
    var todays = videos.filter(function(v){ return v.date === today; });
    var weekStart = formatDate(startOfWeek(new Date()));
    var weekEnd = formatDate(endOfWeek(new Date()));
    var weekPending = videos.filter(function(v){
      return v.date >= weekStart && v.date <= weekEnd && !v.completed;
    });
    var overdue = videos.filter(function(v){ return v.date < today && !v.completed; });

    var curMonth = today.slice(0,7);
    var monthVideos = videos.filter(function(v){ return v.date.slice(0,7) === curMonth; });
    var monthDone = monthVideos.filter(function(v){ return v.completed; });
    var rate = monthVideos.length ? Math.round(monthDone.length / monthVideos.length * 100) : 0;

    var html = "";

    if(overdue.length > 0){
      html += '<div class="banner banner-danger">🔥 <span><b>' + overdue.length + ' 部影片</b>已經逾期還沒拍完，先別發懶，挑一部開始吧！</span>' +
              '<button class="banner-link" data-action="go-overdue">去看逾期影片</button></div>';
    }
    if(todays.length > 0){
      var todayUndone = todays.filter(function(v){ return !v.completed; }).length;
      if(todayUndone > 0){
        html += '<div class="banner banner-yellow">🎯 <span>今天排了 <b>' + todays.length + ' 部</b>影片，還有 <b>' + todayUndone + ' 部</b>沒拍完成！</span></div>';
      }
    }

    html += '<div class="card-grid">' +
      statCard("今天要拍", todays.length, "則短影音", "primary") +
      statCard("本週待完成", weekPending.length, "本週還沒拍", "blue") +
      statCard("本月完成率", rate + "%", monthDone.length + "／" + monthVideos.length + " 則", "sage") +
      statCard("逾期未完成", overdue.length, overdue.length ? "該加緊腳步了" : "目前沒有逾期", "yellow") +
    '</div>';

    html += '<div class="panel">';
    html += '<h3 class="section-title"><span class="dot"></span>今天的拍片計畫</h3>';
    if(todays.length === 0){
      html += '<div class="empty-state"><span class="emoji">🌤️</span>' +
        '<p>今天還沒有安排拍片內容，要不要現在規劃一下？</p>' +
        '<button class="btn btn-primary btn-sm" data-action="add-today">＋ 幫今天排一部影片</button></div>';
    }else{
      todays.forEach(function(v){
        html += todayItemHtml(v);
      });
    }
    html += '</div>';

    mainEl.innerHTML = html;
    bindDashboardEvents();
  }

  function statCard(label, value, sub, color){
    return '<div class="stat-card ' + color + '">' +
      '<div class="label">' + label + '</div>' +
      '<div class="value">' + value + '</div>' +
      '<div class="sub">' + sub + '</div>' +
    '</div>';
  }

  function todayItemHtml(v){
    var status = getStatus(v);
    var badge = status === "done" ? '<span class="badge badge-done">✓ 已完成</span>' : '<span class="badge badge-today">尚未完成</span>';
    return '<div class="today-item" data-id="' + v.id + '">' +
      '<div class="today-item-head">' +
        '<div><div class="topic">' + escapeHtml(v.topic || "（未命名主題）") + '</div>' +
        (v.hook ? '<div class="hook">🎣 ' + escapeHtml(truncate(v.hook, 60)) + '</div>' : '') +
        (v.publishDate ? '<div class="hook">📤 預計發布：' + friendlyDate(v.publishDate) + '</div>' : '') +
        '</div>' +
        '<span class="checkbox-round' + (v.completed ? ' checked' : '') + '" data-action="toggle" data-id="' + v.id + '">✓</span>' +
      '</div>' +
      '<div class="meta-row">' + badge +
        '<button class="btn btn-ghost btn-sm" data-action="edit" data-id="' + v.id + '">查看 / 編輯</button>' +
      '</div>' +
    '</div>';
  }

  function bindDashboardEvents(){
    mainEl.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener("click", function(){ toggleComplete(el.dataset.id); });
    });
    mainEl.querySelectorAll('[data-action="edit"]').forEach(function(el){
      el.addEventListener("click", function(){ openForm(el.dataset.id); });
    });
    var addTodayBtn = mainEl.querySelector('[data-action="add-today"]');
    if(addTodayBtn) addTodayBtn.addEventListener("click", function(){ openForm(null, todayStr()); });
    var goOverdue = mainEl.querySelector('[data-action="go-overdue"]');
    if(goOverdue) goOverdue.addEventListener("click", function(){
      state.view = "list"; state.statusFilter = "overdue"; switchTab("list"); render();
    });
  }

  /* ---------------- calendar ---------------- */
  function renderCalendar(){
    var y = state.calYear, m = state.calMonth;
    var firstDay = new Date(y, m, 1);
    var startOffset = firstDay.getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var today = todayStr();

    var videosByDate = {};
    videos.forEach(function(v){
      (videosByDate[v.date] = videosByDate[v.date] || []).push(v);
    });

    var html = '<div class="panel">';
    html += '<div class="cal-head"><h3 class="month-label">' + y + ' 年 ' + (m+1) + ' 月</h3>' +
      '<div class="cal-nav">' +
        '<button data-action="prev-month">‹</button>' +
        '<button class="btn-sm" data-action="go-today" style="border-radius:999px; padding:6px 12px; font-size:12px;">今天</button>' +
        '<button data-action="next-month">›</button>' +
      '</div></div>';

    html += '<div class="weekday-row">' + WEEKDAYS.map(function(w){ return '<span>'+w+'</span>'; }).join('') + '</div>';
    html += '<div class="cal-grid">';
    for(var i=0;i<startOffset;i++){ html += '<div class="cal-cell blank"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dateStr = y + "-" + pad(m+1) + "-" + pad(day);
      var dayVideos = videosByDate[dateStr] || [];
      var cls = "cal-cell";
      if(dateStr === today) cls += " is-today";
      if(dateStr === state.selectedDay) cls += " is-selected";
      var dots = dayVideos.slice(0,4).map(function(v){
        var st = getStatus(v);
        var dotClass = st === "done" ? "done" : (st === "overdue" ? "overdue" : "pending");
        return '<span class="cal-dot ' + dotClass + '"></span>';
      }).join('');
      html += '<button class="' + cls + '" data-date="' + dateStr + '">' +
        '<span class="num">' + day + '</span>' +
        '<span class="cal-dots">' + dots + '</span>' +
      '</button>';
    }
    html += '</div></div>';

    html += '<div class="panel">';
    html += '<h3 class="day-detail-title">📅 ' + friendlyDate(state.selectedDay) + ' 的拍片計畫</h3>';
    var dayList = videosByDate[state.selectedDay] || [];
    if(dayList.length === 0){
      html += '<div class="empty-state"><span class="emoji">🗓️</span><p>這天還沒有安排影片</p>' +
        '<button class="btn btn-primary btn-sm" data-action="add-day">＋ 幫這天新增影片</button></div>';
    }else{
      dayList.forEach(function(v){ html += todayItemHtml(v); });
    }
    html += '</div>';

    mainEl.innerHTML = html;
    bindCalendarEvents();
  }

  function bindCalendarEvents(){
    var prev = mainEl.querySelector('[data-action="prev-month"]');
    var next = mainEl.querySelector('[data-action="next-month"]');
    var goToday = mainEl.querySelector('[data-action="go-today"]');
    if(prev) prev.addEventListener("click", function(){
      state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; } renderCalendar();
    });
    if(next) next.addEventListener("click", function(){
      state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; } renderCalendar();
    });
    if(goToday) goToday.addEventListener("click", function(){
      var d = new Date();
      state.calMonth = d.getMonth(); state.calYear = d.getFullYear(); state.selectedDay = todayStr();
      renderCalendar();
    });
    mainEl.querySelectorAll('.cal-cell[data-date]').forEach(function(el){
      el.addEventListener("click", function(){ state.selectedDay = el.dataset.date; renderCalendar(); });
    });
    mainEl.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener("click", function(e){ e.stopPropagation(); toggleComplete(el.dataset.id); });
    });
    mainEl.querySelectorAll('[data-action="edit"]').forEach(function(el){
      el.addEventListener("click", function(){ openForm(el.dataset.id); });
    });
    var addDayBtn = mainEl.querySelector('[data-action="add-day"]');
    if(addDayBtn) addDayBtn.addEventListener("click", function(){ openForm(null, state.selectedDay); });
  }

  /* ---------------- list ---------------- */
  function renderList(){
    var html = '<div class="list-controls">' +
      '<div class="search-box">🔍 <input type="text" id="searchInput" placeholder="搜尋主題、hook、內容關鍵字..." value="' + escapeHtml(state.search) + '"></div>' +
      '<select class="filter-select" id="statusFilter">' +
        '<option value="all">全部狀態</option>' +
        '<option value="pending">未完成</option>' +
        '<option value="done">已完成</option>' +
        '<option value="overdue">已逾期</option>' +
      '</select>' +
      '<button class="btn btn-ghost btn-sm" id="sortToggle">日期 ' + (state.sortDir === "desc" ? "↓ 新到舊" : "↑ 舊到新") + '</button>' +
    '</div>';

    var filtered = videos.filter(function(v){
      var matchSearch = !state.search || (v.topic + v.hook + v.content + v.cta).toLowerCase().indexOf(state.search.toLowerCase()) > -1;
      var st = getStatus(v);
      var matchStatus = state.statusFilter === "all" ||
        (state.statusFilter === "pending" && (st === "pending" || st === "today")) ||
        (state.statusFilter === "done" && st === "done") ||
        (state.statusFilter === "overdue" && st === "overdue");
      return matchSearch && matchStatus;
    });

    filtered.sort(function(a,b){
      if(a.date === b.date) return 0;
      var res = a.date < b.date ? -1 : 1;
      return state.sortDir === "desc" ? -res : res;
    });

    if(filtered.length === 0){
      html += '<div class="empty-state"><span class="emoji">🔎</span><p>' +
        (videos.length === 0 ? "還沒有任何影片紀錄，新增第一則吧！" : "沒有符合條件的影片") + '</p>' +
        (videos.length === 0 ? '<button class="btn btn-primary btn-sm" data-action="add-new">＋ 新增影片</button>' : '') +
      '</div>';
    }else{
      filtered.forEach(function(v){
        html += videoCardHtml(v);
      });
    }

    mainEl.innerHTML = html;
    bindListEvents();
  }

  function videoCardHtml(v){
    var st = getStatus(v);
    var badge = st === "done" ? '<span class="badge badge-done">✓ 已完成</span>' :
                st === "overdue" ? '<span class="badge badge-overdue">已逾期</span>' :
                st === "today" ? '<span class="badge badge-today">今天</span>' :
                '<span class="badge badge-pending">待拍攝</span>';
    return '<div class="video-card" data-id="' + v.id + '">' +
      '<div class="video-card-head">' +
        '<div><div class="date-label">🎥 拍攝 ' + friendlyDate(v.date) + (v.publishDate ? '　📤 發布 ' + friendlyDate(v.publishDate) : '') + '</div>' +
        '<div class="topic">' + escapeHtml(v.topic || "（未命名主題）") + '</div></div>' +
        '<div class="toggle-wrap">' + badge +
          '<span class="checkbox-round' + (v.completed ? ' checked' : '') + '" data-action="toggle" data-id="' + v.id + '" title="標記完成">✓</span>' +
        '</div>' +
      '</div>' +
      (v.hook ? '<div class="field-row"><div class="field-label">HOOK</div><div class="field-text">' + escapeHtml(v.hook) + '</div></div>' : '') +
      (v.content ? '<div class="field-row"><div class="field-label">主軸內容</div><div class="field-text">' + escapeHtml(truncate(v.content, 140)) + '</div></div>' : '') +
      (v.cta ? '<div class="field-row"><div class="field-label">CTA</div><div class="field-text">' + escapeHtml(v.cta) + '</div></div>' : '') +
      '<div class="video-card-actions">' +
        '<button class="btn btn-ghost btn-sm" data-action="edit" data-id="' + v.id + '">編輯</button>' +
        '<button class="btn btn-text btn-sm" data-action="delete" data-id="' + v.id + '">刪除</button>' +
      '</div>' +
    '</div>';
  }

  function bindListEvents(){
    var searchInput = document.getElementById("searchInput");
    if(searchInput){
      searchInput.addEventListener("input", function(){
        state.search = searchInput.value;
        renderList();
        var el = document.getElementById("searchInput");
        el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
      });
    }
    var statusFilter = document.getElementById("statusFilter");
    if(statusFilter){
      statusFilter.value = state.statusFilter;
      statusFilter.addEventListener("change", function(){ state.statusFilter = statusFilter.value; renderList(); });
    }
    var sortToggle = document.getElementById("sortToggle");
    if(sortToggle) sortToggle.addEventListener("click", function(){
      state.sortDir = state.sortDir === "desc" ? "asc" : "desc"; renderList();
    });
    mainEl.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener("click", function(e){ e.stopPropagation(); toggleComplete(el.dataset.id); });
    });
    mainEl.querySelectorAll('[data-action="edit"]').forEach(function(el){
      el.addEventListener("click", function(){ openForm(el.dataset.id); });
    });
    mainEl.querySelectorAll('[data-action="delete"]').forEach(function(el){
      el.addEventListener("click", function(){ deleteVideo(el.dataset.id); });
    });
    var addNewBtn = mainEl.querySelector('[data-action="add-new"]');
    if(addNewBtn) addNewBtn.addEventListener("click", function(){ openForm(null); });
  }

  /* ---------------- shared actions ---------------- */
  function toggleComplete(id){
    var v = videos.find(function(x){ return x.id === id; });
    if(!v) return;
    v.completed = !v.completed;
    saveVideos(videos);
    showToast(v.completed ? "太棒了，已標記完成 🎉" : "已改回未完成");
    render();
  }
  function deleteVideo(id){
    if(!confirm("確定要刪除這則影片紀錄嗎？此動作無法復原。")) return;
    videos = videos.filter(function(v){ return v.id !== id; });
    saveVideos(videos);
    showToast("已刪除");
    render();
  }

  /* ---------------- form modal ---------------- */
  var formOverlay = document.getElementById("formOverlay");
  var videoForm = document.getElementById("videoForm");
  var editingId = null;
  var formCompleted = false;

  function openForm(id, presetDate){
    editingId = id || null;
    var titleEl = document.getElementById("formTitle");
    var deleteBtn = document.getElementById("formDeleteBtn");
    if(editingId){
      var v = videos.find(function(x){ return x.id === editingId; });
      titleEl.textContent = "編輯影片內容";
      deleteBtn.style.display = "";
      document.getElementById("f_date").value = v.date;
      document.getElementById("f_publishDate").value = v.publishDate || "";
      document.getElementById("f_topic").value = v.topic || "";
      document.getElementById("f_hook").value = v.hook || "";
      document.getElementById("f_content").value = v.content || "";
      document.getElementById("f_cta").value = v.cta || "";
      formCompleted = !!v.completed;
    }else{
      titleEl.textContent = "新增一則短影音";
      deleteBtn.style.display = "none";
      videoForm.reset();
      document.getElementById("f_date").value = presetDate || todayStr();
      formCompleted = false;
    }
    updateCompleteToggleUI();
    formOverlay.classList.remove("hidden");
    setTimeout(function(){ document.getElementById("f_topic").focus(); }, 50);
  }
  function closeForm(){
    formOverlay.classList.add("hidden");
    editingId = null;
  }
  function updateCompleteToggleUI(){
    var el = document.getElementById("f_completeToggle");
    el.classList.toggle("checked", formCompleted);
  }
  document.getElementById("f_completeToggle").addEventListener("click", function(){
    formCompleted = !formCompleted;
    updateCompleteToggleUI();
  });
  document.getElementById("btnAdd").addEventListener("click", function(){ openForm(null); });
  document.getElementById("formCloseBtn").addEventListener("click", closeForm);
  document.getElementById("formCancelBtn").addEventListener("click", closeForm);
  document.getElementById("formDeleteBtn").addEventListener("click", function(){
    if(editingId){ closeForm(); deleteVideo(editingId); }
  });
  formOverlay.addEventListener("click", function(e){ if(e.target === formOverlay) closeForm(); });

  videoForm.addEventListener("submit", function(e){
    e.preventDefault();
    var date = document.getElementById("f_date").value;
    var topic = document.getElementById("f_topic").value.trim();
    if(!date || !topic){ showToast("請至少填寫拍攝日期與影片主題"); return; }
    var data = {
      date: date,
      publishDate: document.getElementById("f_publishDate").value || "",
      topic: topic,
      hook: document.getElementById("f_hook").value.trim(),
      content: document.getElementById("f_content").value.trim(),
      cta: document.getElementById("f_cta").value.trim(),
      completed: formCompleted
    };
    if(editingId){
      var v = videos.find(function(x){ return x.id === editingId; });
      Object.assign(v, data);
      showToast("已更新影片內容");
    }else{
      data.id = genId();
      data.createdAt = Date.now();
      videos.push(data);
      showToast("已新增到排程表 ✅");
    }
    saveVideos(videos);
    closeForm();
    render();
  });

  /* ---------------- backup ---------------- */
  var backupOverlay = document.getElementById("backupOverlay");
  document.getElementById("btnBackup").addEventListener("click", function(){ backupOverlay.classList.remove("hidden"); });
  document.getElementById("backupCloseBtn").addEventListener("click", function(){ backupOverlay.classList.add("hidden"); });
  backupOverlay.addEventListener("click", function(e){ if(e.target === backupOverlay) backupOverlay.classList.add("hidden"); });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var payload = {
      exportedAt: new Date().toISOString(),
      app: "reels-planner",
      videos: videos
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "拍片排程備份-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("備份檔已下載");
  });

  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function(){ importFile.click(); });
  importFile.addEventListener("change", function(){
    var file = importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var parsed = JSON.parse(e.target.result);
        var list = Array.isArray(parsed) ? parsed : parsed.videos;
        if(!Array.isArray(list)) throw new Error("格式錯誤");
        if(!confirm("匯入將覆蓋目前裝置上的所有資料（共 " + list.length + " 筆），確定要繼續嗎？")) return;
        videos = list;
        saveVideos(videos);
        backupOverlay.classList.add("hidden");
        showToast("匯入成功，共 " + list.length + " 筆資料");
        render();
      }catch(err){
        alert("匯入失敗，請確認這是本工具匯出的備份檔。");
      }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  /* ---------------- tabs ---------------- */
  function switchTab(view){
    state.view = view;
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.view === view);
    });
  }
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.view = btn.dataset.view;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });

  /* ---------------- reminder (best effort) ---------------- */
  function maybeShowReminder(){
    var today = todayStr();
    var todays = videos.filter(function(v){ return v.date === today && !v.completed; });
    var overdue = videos.filter(function(v){ return v.date < today && !v.completed; });
    var lastShown = localStorage.getItem(REMINDER_KEY);
    if(lastShown === today) return;
    if(todays.length === 0 && overdue.length === 0) return;
    localStorage.setItem(REMINDER_KEY, today);
    if("Notification" in window && Notification.permission === "granted"){
      var body = todays.length > 0
        ? "今天要拍 " + todays.length + " 部影片，開工囉！"
        : "有 " + overdue.length + " 部影片逾期未完成，找時間補拍一下～";
      try{ new Notification("拍片排程小助手", {body: body}); }catch(e){}
    }
  }
  if("Notification" in window && Notification.permission === "default"){
    setTimeout(function(){
      Notification.requestPermission().then(function(){ maybeShowReminder(); });
    }, 800);
  }else{
    maybeShowReminder();
  }

  /* ---------------- utils ---------------- */
  function escapeHtml(str){
    if(!str) return "";
    return String(str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }
  function truncate(str, len){
    if(!str) return "";
    return str.length > len ? str.slice(0,len) + "…" : str;
  }

  /* ---------------- init ---------------- */
  switchTab("dashboard");
  render();

  /* ---------------- PWA service worker ---------------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){
        /* 若不是透過網址（例如 file:// 直接開檔）就略過，不影響其他功能 */
      });
    });
  }
})();
</script>
</body>
</html>
